name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Gitrader does not provide strategies, data or factors, and does not hold funds. Requests in those areas will be closed.
        Safety rules (approvals, limits and keys stay with the human) are not negotiable by Agents; proposals that weaken them need a very good reason.
  - type: textarea
    id: problem
    attributes:
      label: The problem you want solved
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - kernel / risk gate
        - ledger
        - workbench
        - MCP / Agent tools
        - engine protocol (GEP)
        - connector
        - plugin / block SDK
        - CLI / install
        - docs
        - other
    validations:
      required: true
